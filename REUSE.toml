version = 1

# Default: everything under the project license expression.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Markus Mayer <widemeadows@gmail.com>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Examples are public domain so readers can copy them freely.
[[annotations]]
path = "examples/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Markus Mayer <widemeadows@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

# Third-party test inputs (tests/fixtures/translated/README.md), never published.
# VHPOP's examples, and the translator output derived from them alone. VHPOP's sources state
# "version 2 of the License, or (at your option) any later version".
[[annotations]]
path = [
  "tests/fixtures/translated/bw-large-a/**",
  "tests/fixtures/translated/get-paid4/**",
  "tests/fixtures/translated/gripper-2/**",
  "tests/fixtures/translated/gripper-4/**",
  "tests/fixtures/translated/sussman-anomaly/**",
  "tests/fixtures/translated/logistics-e/domain.pddl",
]
precedence = "override"
SPDX-FileCopyrightText = "2002-2005 Carnegie Mellon University (VHPOP, Håkan L. S. Younes)"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Potoroo's example problem.
[[annotations]]
path = ["tests/fixtures/translated/logistics-e/problem.pddl", "tests/fixtures/translated/NOTICE.potoroo"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Harrison Oates (Potoroo)"
SPDX-License-Identifier = "Apache-2.0"

# Translator output derived from the VHPOP domain and the Potoroo problem together.
[[annotations]]
path = "tests/fixtures/translated/logistics-e/output.sas"
precedence = "override"
SPDX-FileCopyrightText = [
  "2002-2005 Carnegie Mellon University (VHPOP, Håkan L. S. Younes)",
  "2026 Harrison Oates (Potoroo)",
]
SPDX-License-Identifier = "GPL-2.0-or-later AND Apache-2.0"
